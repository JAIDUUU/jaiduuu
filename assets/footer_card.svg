<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 110" width="100%" height="auto">
  <defs>
    <style>
      /* Reverse Speed Line Animation (Right to Left) for Dual-Direction Dynamics */
      @keyframes purpleWarpRTL {
        0% {
          transform: translateX(1000px);
          opacity: 0;
        }
        12% {
          opacity: 0.95;
        }
        88% {
          opacity: 0.95;
        }
        100% {
          transform: translateX(-1100px);
          opacity: 0;
        }
      }

      @keyframes footerPulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.85; }
      }

      .p-beam {
        animation: purpleWarpRTL linear infinite;
      }

      .pb-1  { animation-duration: 0.65s; animation-delay: 0.00s; }
      .pb-2  { animation-duration: 0.80s; animation-delay: 0.15s; }
      .pb-3  { animation-duration: 0.55s; animation-delay: 0.30s; }
      .pb-4  { animation-duration: 0.72s; animation-delay: 0.08s; }
      .pb-5  { animation-duration: 0.60s; animation-delay: 0.22s; }
      .pb-6  { animation-duration: 0.85s; animation-delay: 0.40s; }
      .pb-7  { animation-duration: 0.50s; animation-delay: 0.18s; }
      .pb-8  { animation-duration: 0.78s; animation-delay: 0.35s; }

      .footer-border {
        animation: footerPulse 3s ease-in-out infinite;
      }
    </style>

    <!-- Deep Violet & Purple Cyber Radial Gradient -->
    <linearGradient id="purpleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#110722"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>

    <!-- Purple / Pink Laser Gradients -->
    <linearGradient id="purpleBeam" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#c084fc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="pinkBeam" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="40%" stop-color="#d946ef" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#f43f5e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <filter id="purpleGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cyber Violet Base -->
  <rect width="920" height="110" rx="16" fill="url(#purpleBg)"/>

  <!-- Right to Left Purple & Pink Speed Lines -->
  <g id="purpleBeamsGroup" filter="url(#purpleGlow)">
    <rect class="p-beam pb-1" x="0" y="15"  width="450" height="2.2" rx="1.1" fill="url(#purpleBeam)"/>
    <rect class="p-beam pb-3" x="0" y="32"  width="580" height="2.8" rx="1.4" fill="url(#pinkBeam)"/>
    <rect class="p-beam pb-5" x="0" y="52"  width="380" height="1.8" rx="0.9" fill="url(#purpleBeam)"/>
    <rect class="p-beam pb-2" x="0" y="70"  width="640" height="3.2" rx="1.6" fill="url(#pinkBeam)"/>
    <rect class="p-beam pb-7" x="0" y="88"  width="420" height="2.0" rx="1.0" fill="url(#purpleBeam)"/>
    <rect class="p-beam pb-4" x="0" y="98"  width="520" height="2.5" rx="1.2" fill="url(#pinkBeam)"/>
  </g>

  <!-- Dark translucent overlay for crisp text readability -->
  <rect x="0" y="0" width="920" height="110" rx="16" fill="#05020c" opacity="0.4"/>

  <!-- Center Content: Quote & Links -->
  <text x="460" y="44" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="0.5">
    ⚡ Progress over perfection. Build → Break → Understand → Ship.
  </text>

  <!-- Badges / Links inside footer bar -->
  <g transform="translate(365, 62)">
    <a href="https://github.com/JAIDUUU" target="_blank">
      <rect width="88" height="28" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <text x="44" y="18" fill="#e0e7ff" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">GitHub ↗</text>
    </a>
  </g>
  <g transform="translate(468, 62)">
    <a href="mailto:JAIDZXXD@GMAIL.COM">
      <rect width="88" height="28" rx="6" fill="#831843" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="44" y="18" fill="#ffe4e6" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Email ✉</text>
    </a>
  </g>

  <!-- Neon Glowing Outer Frame -->
  <rect class="footer-border" x="2" y="2" width="916" height="106" rx="15" fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.7"/>
  <rect x="5" y="5" width="910" height="100" rx="13" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.35"/>
</svg>
