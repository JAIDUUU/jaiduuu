<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 240" width="100%" height="auto" fill="none">

  <!-- Card Background -->
  <rect width="890" height="240" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Header -->
  <g transform="translate(24, 34)">
    <rect x="0" y="0" width="28" height="20" rx="4"
          fill="#161b22" stroke="#30363d" stroke-width="1"/>

    <text x="6" y="14"
          fill="#ffffff"
          font-family="monospace"
          font-size="12"
          font-weight="bold">~/</text>

    <text x="38" y="15"
          fill="#ffffff"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="14"
          font-weight="600">
      GitHub Activity
    </text>

    <text x="842" y="14"
          text-anchor="end"
          fill="#8b949e"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="11">
      Backend Development
    </text>

    <line x1="0" y1="26" x2="842" y2="26"
          stroke="#21262d" stroke-width="1"/>
  </g>


  <!-- Main Activity Card -->
  <g transform="translate(24, 78)">

    <rect width="842" height="125" rx="8"
          fill="#161b22"
          stroke="#21262d"
          stroke-width="1"/>

    <!-- Commit Count -->
    <g transform="translate(28, 25)">

      <text x="0" y="28"
            fill="#ffffff"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="30"
            font-weight="700">
        ~10
      </text>

      <text x="0" y="50"
            fill="#8b949e"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="11">
        GitHub Commits
      </text>

    </g>


    <!-- Divider -->
    <line x1="190" y1="22" x2="190" y2="103"
          stroke="#30363d" stroke-width="1"/>


    <!-- Focus -->
    <g transform="translate(220, 25)">

      <text x="0" y="20"
            fill="#e6edf3"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="13"
            font-weight="600">
        Current Focus
      </text>

      <text x="0" y="42"
            fill="#8b949e"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="11">
        Python • FastAPI • SQLAlchemy
      </text>

      <text x="0" y="61"
            fill="#8b949e"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="11">
        PostgreSQL • Backend Development
      </text>

    </g>


    <!-- Divider -->
    <line x1="560" y1="22" x2="560" y2="103"
          stroke="#30363d" stroke-width="1"/>


    <!-- Activity Status -->
    <g transform="translate(590, 25)">

      <text x="0" y="20"
            fill="#e6edf3"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="13"
            font-weight="600">
        Activity
      </text>

      <text x="0" y="42"
            fill="#8b949e"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="11">
        Learning &amp; building
      </text>

      <text x="0" y="61"
            fill="#8b949e"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="11">
        through practical projects
      </text>

    </g>

  </g>

</svg>