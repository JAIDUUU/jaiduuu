<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="auto">
  <defs>
    <style>
      /* Amber & Gold Hyper-Speed Beams (Left to Right) */
      @keyframes goldSpeedLTR {
        0% { transform: translateX(-850px); opacity: 0; }
        10% { opacity: 0.95; }
        90% { opacity: 0.95; }
        100% { transform: translateX(1050px); opacity: 0; }
      }
      @keyframes goldBorderPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.95; }
      }
      .g-beam { animation: goldSpeedLTR linear infinite; }
      .gb-1 { animation-duration: 0.75s; animation-delay: 0.00s; }
      .gb-2 { animation-duration: 0.92s; animation-delay: 0.22s; }
      .gb-3 { animation-duration: 0.65s; animation-delay: 0.40s; }
      .gb-4 { animation-duration: 0.82s; animation-delay: 0.12s; }
      .gb-5 { animation-duration: 0.70s; animation-delay: 0.32s; }
      .gb-6 { animation-duration: 0.88s; animation-delay: 0.55s; }

      .card-border { animation: goldBorderPulse 3s ease-in-out infinite; }
    </style>

    <!-- Deep Warm Charcoal / Cyber Amber Gradient -->
    <linearGradient id="activityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1305"/>
      <stop offset="50%" stop-color="#120902"/>
      <stop offset="100%" stop-color="#050201"/>
    </linearGradient>

    <!-- Amber, Gold & Flame Laser Beams -->
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#fbbf24" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="flameBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#fb923c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep Warm Cyber Base -->
  <rect width="920" height="310" rx="16" fill="url(#activityBg)"/>

  <!-- Amber & Flame Laser Streaks (Left to Right) -->
  <g filter="url(#goldGlow)">
    <rect class="g-beam gb-1" x="0" y="25"  width="520" height="2.2" rx="1.1" fill="url(#goldBeam)"/>
    <rect class="g-beam gb-3" x="0" y="70"  width="640" height="2.8" rx="1.4" fill="url(#flameBeam)"/>
    <rect class="g-beam gb-5" x="0" y="140" width="410" height="1.8" rx="0.9" fill="url(#goldBeam)"/>
    <rect class="g-beam gb-2" x="0" y="210" width="700" height="3.0" rx="1.5" fill="url(#flameBeam)"/>
    <rect class="g-beam gb-6" x="0" y="260" width="480" height="2.0" rx="1.0" fill="url(#goldBeam)"/>
    <rect class="g-beam gb-4" x="0" y="290" width="560" height="2.4" rx="1.2" fill="url(#flameBeam)"/>
  </g>

  <!-- Dark translucent backing so live stats are crystal clear -->
  <rect x="0" y="0" width="920" height="310" rx="16" fill="#070301" opacity="0.4"/>

  <!-- Section Title -->
  <text x="45" y="44" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">
    🔥 GitHub Activity &amp; Streak Metrics
  </text>
  <text x="45" y="70" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">
    Live real-time stats updating automatically with every commit, push &amp; contribution streak.
  </text>

  <!-- LIVE STATS EMBEDDED DIRECTLY INSIDE THIS ANIMATED CONTAINER -->
  <!-- Left: Real-time Stats Card -->
  <image href="https://github-readme-stats.vercel.app/api?username=JAIDUUU&amp;show_icons=true&amp;theme=tokyonight&amp;hide_border=true&amp;title_color=fbbf24&amp;icon_color=f59e0b&amp;text_color=cbd5e1&amp;bg_color=140902" x="40" y="90" width="415" height="195"/>

  <!-- Right: Real-time Streak Stats Card (Updates dynamically when streak grows) -->
  <image href="https://github-readme-streak-stats.herokuapp.com/?user=JAIDUUU&amp;theme=tokyonight&amp;hide_border=true&amp;stroke=fbbf24&amp;ring=f59e0b&amp;fire=f97316&amp;currStreakLabel=fbbf24&amp;background=140902" x="465" y="90" width="415" height="195"/>

  <!-- Glowing Neon Outer Frame -->
  <rect class="card-border" x="2" y="2" width="916" height="306" rx="15" fill="none" stroke="#f59e0b" stroke-width="1.8" opacity="0.7"/>
  <rect x="5" y="5" width="910" height="300" rx="13" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.35"/>
</svg>
