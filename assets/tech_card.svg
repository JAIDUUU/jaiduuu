<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" width="100%" height="auto">
  <defs>
    <style>
      @keyframes speedLTR {
        0% { transform: translateX(-850px); opacity: 0; }
        10% { opacity: 0.95; }
        90% { opacity: 0.95; }
        100% { transform: translateX(1050px); opacity: 0; }
      }
      @keyframes techPulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }
      .beam-ltr { animation: speedLTR linear infinite; }
      .t-1 { animation-duration: 0.78s; animation-delay: 0.00s; }
      .t-2 { animation-duration: 0.90s; animation-delay: 0.20s; }
      .t-3 { animation-duration: 0.65s; animation-delay: 0.40s; }
      .t-4 { animation-duration: 0.82s; animation-delay: 0.12s; }
      .t-5 { animation-duration: 0.70s; animation-delay: 0.35s; }
      .card-border { animation: techPulse 3s ease-in-out infinite; }
    </style>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f1e"/>
      <stop offset="50%" stop-color="#021213"/>
      <stop offset="100%" stop-color="#010607"/>
    </linearGradient>
    <linearGradient id="emeraldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="40%" stop-color="#059669" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#34d399" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="tealBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="40%" stop-color="#0891b2" stop-opacity="0.85"/>
      <stop offset="90%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="920" height="230" rx="16" fill="url(#techBg)"/>

  <!-- Emerald & Teal Speed Lines -->
  <g filter="url(#emeraldGlow)">
    <rect class="beam-ltr t-1" x="0" y="25"  width="460" height="2.2" rx="1.1" fill="url(#emeraldBeam)"/>
    <rect class="beam-ltr t-3" x="0" y="65"  width="600" height="2.8" rx="1.4" fill="url(#tealBeam)"/>
    <rect class="beam-ltr t-5" x="0" y="115" width="420" height="1.8" rx="0.9" fill="url(#emeraldBeam)"/>
    <rect class="beam-ltr t-2" x="0" y="160" width="670" height="3.0" rx="1.5" fill="url(#tealBeam)"/>
    <rect class="beam-ltr t-4" x="0" y="200" width="510" height="2.2" rx="1.1" fill="url(#emeraldBeam)"/>
  </g>

  <rect x="0" y="0" width="920" height="230" rx="16" fill="#010708" opacity="0.45"/>

  <!-- Content -->
  <text x="45" y="44" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">
    🛠️ Tech Stack
  </text>

  <!-- Row 1: Languages -->
  <g transform="translate(45, 68)">
    <text x="0" y="15" fill="#34d399" font-family="monospace" font-size="13.5" font-weight="700">Languages</text>
    <text x="145" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">: Python, Java, SQL, Bash</text>
  </g>

  <!-- Row 2: AI & Workflows -->
  <g transform="translate(45, 100)">
    <text x="0" y="15" fill="#38bdf8" font-family="monospace" font-size="13.5" font-weight="700">AI &amp; Workflows</text>
    <text x="145" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">: LangGraph, LangChain, PyTorch, Scikit-Learn</text>
  </g>

  <!-- Row 3: Backend & APIs -->
  <g transform="translate(45, 132)">
    <text x="0" y="15" fill="#a78bfa" font-family="monospace" font-size="13.5" font-weight="700">Backend &amp; Web</text>
    <text x="145" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">: FastAPI, REST APIs, Pydantic, SQLAlchemy</text>
  </g>

  <!-- Row 4: Databases -->
  <g transform="translate(45, 164)">
    <text x="0" y="15" fill="#f472b6" font-family="monospace" font-size="13.5" font-weight="700">Databases</text>
    <text x="145" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">: PostgreSQL, MySQL</text>
  </g>

  <!-- Row 5: Systems & Environment -->
  <g transform="translate(45, 196)">
    <text x="0" y="15" fill="#fbbf24" font-family="monospace" font-size="13.5" font-weight="700">Environment</text>
    <text x="145" y="15" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">: Linux, Git, Docker (Foundations)</text>
  </g>

  <rect class="card-border" x="2" y="2" width="916" height="226" rx="15" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.6"/>
  <rect x="5" y="5" width="910" height="220" rx="13" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3"/>
</svg>
